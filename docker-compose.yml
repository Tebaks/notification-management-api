services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DSN: "host=postgres port=5432 user=notify password=notify dbname=notifications sslmode=disable"
      REDIS_ADDR: "redis:6379"
      WEBHOOK_URL: https://webhook.site/YOUR_UNIQUE_ID_HERE  # get a free URL at webhook.site
      SERVER_PORT: "8080"
      WORKER_CONCURRENCY: "10"
      WORKER_RATE_LIMIT_PER_SEC: "100"
      WORKER_MAX_RETRIES: "3"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4318"
      OTEL_SERVICE_NAME: "notification-api"
      OTEL_ENVIRONMENT: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
