version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
  settings:
    goimports:
      local-prefixes: github.com/kenanabbak/notification-management-api

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
    - path: internal/domain/mocks/
      linters:
        - all
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
